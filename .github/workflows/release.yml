name: Release to TestFlight
on:
  push:
    tags: ["dryrun-*", "release-*"]   # dryrun-*: build and sign only. release-*: also upload to TestFlight.
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (turn off for a signing-only dry run)"
        type: boolean
        default: true
jobs:
  testflight:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Logic tests
        run: swift test
      - name: Make the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Save the build key (runner is wiped after the job)
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          F=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # The secret may have lost its BEGIN/END lines when pasted from a phone: add them back if missing.
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$F"
          else
            { echo '-----BEGIN PRIVATE KEY-----'; printf '%s\n' "$ASC_KEY_P8" | tr -d ' \r'; echo '-----END PRIVATE KEY-----'; } > "$F"
          fi
          chmod 600 "$F"
          echo "key file lines: $(wc -l < "$F"), valid PEM: $(openssl pkey -in "$F" -noout >/dev/null 2>&1 && echo yes || echo no)"
      - name: Archive with a stand-in signature (keeps the App Group entitlement; no device profile needed; export re-signs for the App Store)
        run: |
          xcodebuild archive -project PrayerWidgets.xcodeproj -scheme PrayerWidgets \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -40
      - name: Export the app file
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>DY67Q9267Z</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportPath "$RUNNER_TEMP/out" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          ls "$RUNNER_TEMP/out"
      - name: Show whether the exported app carries the App Group (the widget needs it to read the app's saved choices)
        run: |
          cd "$RUNNER_TEMP/out" && rm -rf x && mkdir x && unzip -q PrayerWidgets.ipa -d x
          for a in x/Payload/*.app x/Payload/*.app/PlugIns/*.appex; do
            echo "== $a"
            codesign -d --entitlements :- "$a" 2>/dev/null | grep -A2 -i "application-groups" || echo "NO application-groups entitlement"
          done
          rm -rf x
      - name: Upload to TestFlight
        if: ${{ startsWith(github.ref_name, 'release-') || inputs.upload == true }}
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP/out/PrayerWidgets.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
