name: App Store name (read, or rename)
on:
  workflow_dispatch:
    inputs:
      new_name:
        description: "Leave empty to only READ the current store name. Fill in to rename."
        required: false
        default: ""
jobs:
  name:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      NEW_NAME: ${{ inputs.new_name }}
    steps:
      - run: pip install pyjwt cryptography >/dev/null
      - name: Read or rename
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.error, jwt
          k = os.environ["ASC_KEY_P8"]
          if "BEGIN PRIVATE KEY" not in k:
              k = "-----BEGIN PRIVATE KEY-----\n" + k.replace(" ", "").replace("\r", "") + "\n-----END PRIVATE KEY-----\n"
          t = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"}, k, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          def call(path, method="GET", body=None):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, method=method, data=json.dumps(body).encode() if body else None, headers={"Authorization": "Bearer " + t, "Content-Type": "application/json"})
              try:
                  return json.load(urllib.request.urlopen(r))
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, e.read().decode()[:1500]); raise SystemExit(1)
          apps = call("/v1/apps?filter[bundleId]=com.zorell.prayerwidgets")["data"]
          print("apps found:", [(a["id"], a["attributes"]["name"]) for a in apps])
          app = apps[0]["id"]
          for info in call(f"/v1/apps/{app}/appInfos")["data"]:
              print("appInfo", info["id"], "state:", info["attributes"].get("appStoreState"), info["attributes"].get("state"))
              for loc in call(f"/v1/appInfos/{info['id']}/appInfoLocalizations")["data"]:
                  a = loc["attributes"]
                  print("  locale", a["locale"], "name:", repr(a["name"]), "subtitle:", repr(a.get("subtitle")), "loc id", loc["id"])
                  new = os.environ.get("NEW_NAME", "").strip()
                  if new and a["name"] != new:
                      res = call(f"/v1/appInfoLocalizations/{loc['id']}", "PATCH", {"data": {"type": "appInfoLocalizations", "id": loc["id"], "attributes": {"name": new}}})
                      print("  RENAMED to", repr(res["data"]["attributes"]["name"]))
          PY
