name: PrayerWidgets
options:
  bundleIdPrefix: app.prayerwidgets   # placeholder: the real prefix is chosen when the Apple account exists
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Shared: { path: . }
targets:
  PrayerWidgets:
    type: application
    platform: iOS
    sources: [Sources/App]
    dependencies:
      - package: Shared
      - target: PrayerWidgetsWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.prayerwidgets.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Prayer Widgets
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  PrayerWidgetsWidget:
    type: app-extension
    platform: iOS
    sources: [Sources/Widget]
    dependencies:
      - package: Shared
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: Prayer Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.prayerwidgets.ios.widget
        TARGETED_DEVICE_FAMILY: "1"
