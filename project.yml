name: PrayerWidgets
options:
  bundleIdPrefix: com.zorell
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: DY67Q9267Z     # Team ID: an identifier, not a secret
    CODE_SIGN_STYLE: Automatic
packages:
  Shared: { path: . }
targets:
  PrayerWidgets:
    type: application
    platform: iOS
    sources: [Sources/App, Sources/WidgetViews]
    entitlements:
      path: Sources/App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zorell.prayerwidgets]
    dependencies:
      - package: Shared
      - target: PrayerWidgetsWidget
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Prayer Widgets
        UILaunchScreen: { UIColorName: LaunchNavy }
        NSLocationWhenInUseUsageDescription: Used only to point the compass towards the Kaaba. Your location stays on your phone.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zorell.prayerwidgets
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  PrayerWidgetsWidget:
    type: app-extension
    platform: iOS
    sources: [Sources/Widget, Sources/WidgetViews]
    entitlements:
      path: Sources/Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zorell.prayerwidgets]
    dependencies:
      - package: Shared
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: Prayer Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zorell.prayerwidgets.widget
        TARGETED_DEVICE_FAMILY: "1"
